<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>我的思想库</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0f1115; --sf:#181b22; --sf2:#20242e; --bd:#272c38;
  --tx:#e8eaf0; --tx2:#9aa3b6; --tx3:#6b7386;
  --ac:#4a7bf7; --acb:rgba(74,123,247,.14);
  --rd:#e0554f; --rdb:rgba(224,85,79,.14);
  --fs:17px; --lh:1.9;
}
body.light{
  --bg:#f7f8fa; --sf:#ffffff; --sf2:#eef0f4; --bd:#e2e5ec;
  --tx:#1a1d24; --tx2:#5b6478; --tx3:#8b93a5;
  --ac:#2b5fd9; --acb:rgba(43,95,217,.10);
  --rd:#c0382f; --rdb:rgba(192,56,47,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
body{min-height:100vh;min-height:100dvh;}

/* ---------- 顶栏 ---------- */
#bar{position:sticky;top:0;z-index:30;background:rgba(15,17,21,.86);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;}
body.light #bar{background:rgba(247,248,250,.88);}
#bar .ttl{font-size:15px;font-weight:600;letter-spacing:.3px;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ib{width:36px;height:36px;flex:0 0 36px;border-radius:10px;border:1px solid var(--bd);
  background:var(--sf);color:var(--tx2);display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;transition:.15s;}
.ib:active{transform:scale(.92);background:var(--sf2);}

/* ---------- 搜索 ---------- */
#sersec{padding:12px 14px 4px;}
#q{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);
  color:var(--tx);font-size:15px;outline:none;font-family:inherit;}
#q::placeholder{color:var(--tx3);}
#q:focus{border-color:var(--ac);}

/* ---------- chips ---------- */
#chips{display:flex;gap:8px;padding:10px 14px 4px;overflow-x:auto;scrollbar-width:none;}
#chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;padding:6px 13px;border-radius:999px;border:1px solid var(--bd);
  background:var(--sf);color:var(--tx2);font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap;}
.chip.on{background:var(--acb);border-color:var(--ac);color:var(--ac);font-weight:600;}

/* ---------- 列表 ---------- */
#list{padding:8px 14px calc(env(safe-area-inset-bottom) + 40px);}
.grp{font-size:12px;color:var(--tx3);letter-spacing:1px;margin:18px 4px 8px;font-weight:600;}
.it{display:flex;align-items:center;gap:11px;padding:13px 14px;margin-bottom:7px;border-radius:13px;
  background:var(--sf);border:1px solid var(--bd);cursor:pointer;transition:.12s;}
.it:active{transform:scale(.985);background:var(--sf2);}
.it .ico{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--acb);
  color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.it .nm{flex:1;font-size:15px;line-height:1.45;word-break:break-all;}
.it .sub{font-size:11.5px;color:var(--tx3);margin-top:2px;}
.it .badge{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--rdb);color:var(--rd);flex:0 0 auto;}

/* ---------- 阅读 ---------- */
#read{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;}
#read.on{display:flex;}
#rbar{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.9);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;}
body.light #rbar{background:rgba(247,248,250,.92);}
#rbar .ttl{flex:1;font-size:13.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;}
#art{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:20px 18px calc(env(safe-area-inset-bottom) + 80px);font-size:var(--fs);line-height:var(--lh);}
#art h1{font-size:1.5em;line-height:1.4;margin:.5em 0 .8em;font-weight:700;letter-spacing:.2px;}
#art h2{font-size:1.25em;line-height:1.5;margin:1.7em 0 .7em;font-weight:700;
  padding-left:11px;border-left:3px solid var(--ac);}
#art h3{font-size:1.1em;margin:1.5em 0 .55em;font-weight:600;color:var(--tx);}
#art h4,#art h5,#art h6{font-size:1em;margin:1.3em 0 .5em;font-weight:600;color:var(--tx2);}
#art p{margin:0 0 1em;word-break:break-word;}
#art strong{color:var(--tx);font-weight:700;}
body.light #art strong{color:#000;}
#art em{font-style:normal;color:var(--rd);}
#art code{background:var(--sf2);padding:2px 6px;border-radius:5px;font-size:.88em;
  font-family:ui-monospace,Menlo,Consolas,monospace;color:#e5a06a;}
#art pre{background:var(--sf);border:1px solid var(--bd);border-radius:11px;padding:14px;
  overflow-x:auto;margin:0 0 1.2em;}
#art pre code{background:none;padding:0;color:var(--tx2);font-size:.82em;line-height:1.65;}
#art blockquote{margin:0 0 1.1em;padding:10px 14px;border-left:3px solid var(--bd);
  background:var(--sf);border-radius:0 9px 9px 0;color:var(--tx2);font-size:.95em;}
#art blockquote p:last-child{margin-bottom:0;}
#art hr{border:0;border-top:1px solid var(--bd);margin:2em 0;}
#art ul,#art ol{margin:0 0 1.1em;padding-left:22px;}
#art li{margin-bottom:.4em;}
#art a{color:var(--ac);text-decoration:none;border-bottom:1px solid transparent;}
#art a.wl{border-bottom:1px dashed var(--ac);cursor:pointer;}
#art .tw{overflow-x:auto;margin:0 0 1.2em;-webkit-overflow-scrolling:touch;
  border:1px solid var(--bd);border-radius:11px;}
#art table{border-collapse:collapse;width:100%;font-size:.85em;min-width:100%;}
#art th{background:var(--sf2);padding:9px 11px;text-align:left;font-weight:600;
  border-bottom:1px solid var(--bd);white-space:nowrap;chinese:1;}
#art td{padding:9px 11px;border-bottom:1px solid var(--bd);vertical-align:top;line-height:1.65;}
#art tr:last-child td{border-bottom:0;}

/* ---------- 设置 ---------- */
#setup{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;display:none;
  padding:calc(env(safe-area-inset-top) + 30px) 20px 60px;}
#setup.on{display:block;}
#setup h1{font-size:22px;margin:0 0 6px;}
#setup .lead{color:var(--tx2);font-size:14px;line-height:1.75;margin:0 0 26px;}
.fld{margin-bottom:20px;}
.fld label{display:block;font-size:13px;color:var(--tx2);margin-bottom:8px;font-weight:600;}
.fld input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--bd);
  background:var(--sf);color:var(--tx);font-size:15px;outline:none;font-family:inherit;}
.fld input:focus{border-color:var(--ac);}
.fld .hint{font-size:12px;color:var(--tx3);line-height:1.7;margin-top:8px;}
.fld .hint a{color:var(--ac);}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--ac);color:#fff;
  font-size:15.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s;}
.btn:active{transform:scale(.98);opacity:.9;}
.btn.gh{background:var(--sf);color:var(--tx2);border:1px solid var(--bd);margin-top:10px;}
#msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.65;display:none;}
#msg.err{display:block;background:var(--rdb);color:var(--rd);}
#msg.ok{display:block;background:var(--acb);color:var(--ac);}

/* ---------- 状态 ---------- */
.loading{text-align:center;padding:60px 20px;color:var(--tx3);font-size:14px;}
.spin{width:26px;height:26px;border:2.5px solid var(--bd);border-top-color:var(--ac);
  border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--tx3);font-size:14px;line-height:1.8;}
.skel{height:56px;border-radius:13px;background:var(--sf);margin-bottom:7px;
  animation:pl 1.3s ease-in-out infinite;}
@keyframes pl{0%,100%{opacity:.5}50%{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translateX(-50%);
  background:var(--sf2);border:1px solid var(--bd);color:var(--tx);padding:11px 18px;border-radius:11px;
  font-size:13.5px;z-index:99;max-width:86vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);}
</style>
</head>
<body>

<div id="bar">
  <div class="ttl" id="barTitle">我的思想库</div>
  <div class="ib" id="btnRefresh" title="刷新">↻</div>
  <div class="ib" id="btnFont" title="字号">A</div>
  <div class="ib" id="btnSet" title="设置">⚙</div>
</div>

<div id="sersec"><input id="q" type="search" placeholder="搜文件名，比如：缓冲、四级、Jack" autocomplete="off"></div>
<div id="chips"></div>
<div id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>

<div id="read">
  <div id="rbar">
    <div class="ib" id="btnBack">‹</div>
    <div class="ttl" id="rTitle"></div>
    <div class="ib" id="btnFont2">A</div>
  </div>
  <article id="art"></article>
</div>

<div id="setup">
  <h1>一次性设置</h1>
  <p class="lead">这东西只做一件事：把你在 GitHub 私人仓库里的笔记，变成一个点开就能看的列表。<br>下面的 key 只存在你这台手机里，不会上传到任何地方。</p>

  <div class="fld">
    <label>1. 仓库名</label>
    <input id="inRepo" placeholder="wdfxf/p-life-system" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="hint">格式是 用户名/仓库名。默认已经填好了，不用改。</div>
  </div>

  <div class="fld">
    <label>2. 访问钥匙（Token）</label>
    <input id="inTok" type="password" placeholder="ghp_... 或 github_pat_..." autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="hint">
      没有的话点这里去生成：<a href="https://github.com/settings/tokens/new?scopes=repo&description=my-notes-reader" target="_blank">github.com/settings/tokens/new</a><br>
      · Note 随便填，比如 reader<br>
      · Expiration 选 90 days 或 No expiration<br>
      · 下面勾选框只勾第一个 <b>repo</b><br>
      · 拉到底点绿色 Generate token，复制那串字符粘到上面
    </div>
  </div>

  <button class="btn" id="btnSave">保存并试试能不能读到</button>
  <button class="btn gh" id="btnSkip">先看看界面（没钥匙读不到内容）</button>
  <div id="msg"></div>
</div>

<script>
'use strict';
const KEY='wbreader_v1';
const DEF={repo:'wdfxf/p-life-system',token:'',fs:17,theme:'dark',recent:[],cat:'all'};
let S=Object.assign({},DEF);
let files=[], cache={}, curCat='all';

/* ---------- 存储 ---------- */
function load(){
  try{const j=JSON.parse(localStorage.getItem(KEY)||'{}');S=Object.assign({},DEF,j);}catch(e){S=Object.assign({},DEF);}
  applyTheme();applyFont();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function applyTheme(){document.body.classList.toggle('light',S.theme==='light');
  const m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute('content',S.theme==='light'?'#f7f8fa':'#0f1115');}
function applyFont(){document.documentElement.style.setProperty('--fs',S.fs+'px');}

/* ---------- 工具 ---------- */
function toast(t,ms){
  const d=document.createElement('div');d.className='toast';d.textContent=t;
  document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2200);
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function encPath(p){return p.split('/').map(encodeURIComponent).join('/');}
function baseName(p){return p.split('/').pop().replace(/\.md$/i,'');}
function catOf(p){
  if(/^Jack 365/.test(p))return 'Jack365';
  if(/^Jack/.test(p))return 'Jack';
  if(/^\d{4}-\d{2}-\d{2}/.test(p))return '日期笔记';
  return '其他';
}

/* ---------- API ---------- */
async function api(path,retry){
  const r=await fetch('https://api.github.com'+path,{
    headers:{'Authorization':'token '+S.token,'Accept':'application/vnd.github+json'}
  });
  if(r.status===401||r.status===403){
    const e=new Error('AUTH');e.code=r.status;throw e;
  }
  if(r.status===404){const e=new Error('NOTFOUND');throw e;}
  if(!r.ok){const e=new Error('HTTP '+r.status);throw e;}
  return r.json();
}

async function fetchFiles(){
  const meta=await api('/repos/'+S.repo);
  const br=meta.default_branch||'main';
  const tree=await api('/repos/'+S.repo+'/git/trees/'+br+'?recursive=1');
  return (tree.tree||[])
    .filter(x=>x.type==='blob'&&/\.md$/i.test(x.path)&&!/^\./.test(x.path))
    .map(x=>({path:x.path,name:baseName(x.path),dir:x.path.includes('/')?x.path.split('/')[0]:'',cat:catOf(x.path)}));
}

async function fetchText(path){
  if(cache[path]&&Date.now()-cache[path].t<36e5)return cache[path].v;
  const j=await api('/repos/'+S.repo+'/contents/'+encPath(path));
  let text='';
  if(j.content&&j.encoding==='base64'){
    const bin=atob(j.content.replace(/\s/g,''));
    const u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    text=new TextDecoder('utf-8').decode(u);
  }else if(j.download_url){
    const r=await fetch(j.download_url,{headers:{'Authorization':'token '+S.token}});
    text=await r.text();
  }
  cache[path]={v:text,t:Date.now()};
  return text;
}

/* ---------- Markdown 渲染 ---------- */
function inline(s){
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g,function(_,a,b){
    return '<a class="wl" data-t="'+String(a).trim()+'">'+((b||a)+'')+'</a>';
  });
  s=s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function splitRow(l){
  return l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());
}
function md(src){
  src=src.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/,'');
  const keep=[];
  src=src.replace(/<\/?(?:span|b|strong|br|i|em|div|u|sup|sub|font)(?:\s[^>]*)?\/?>/gi,function(m){
    keep.push(m);return '\u0000'+(keep.length-1)+'\u0001';
  });
  src=esc(src);
  src=src.replace(/\u0000(\d+)\u0001/g,function(_,i){return keep[+i];});

  const L=src.split(/\r?\n/);
  const out=[];
  let i=0;
  while(i<L.length){
    const line=L[i];
    if(/^```/.test(line)){
      const buf=[];i++;
      while(i<L.length&&!/^```/.test(L[i])){buf.push(L[i]);i++;}
      i++;out.push('<pre><code>'+buf.join('\n')+'</code></pre>');continue;
    }
    if(!line.trim()){i++;continue;}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){out.push('<hr>');i++;continue;}
    let m=line.match(/^(#{1,6})\s+(.*)$/);
    if(m){const n=m[1].length;out.push('<h'+n+'>'+inline(m[2])+'</h'+n+'>');i++;continue;}
    if(/^\s*\|/.test(line)&&i+1<L.length&&/^\s*\|[\s:|-]+\|?\s*$/.test(L[i+1])){
      const head=splitRow(line);i+=2;
      const rows=[];
      while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(splitRow(L[i]));i++;}
      out.push('<div class="tw"><table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+
        '</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+
        '</tbody></table></div>');
      continue;
    }
    if(/^>/.test(line)){
      const buf=[];
      while(i<L.length&&/^>/.test(L[i])){buf.push(L[i].replace(/^>\s?/,''));i++;}
      out.push('<blockquote>'+md(buf.join('\n'))+'</blockquote>');continue;
    }
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      const ordered=/^\s*\d+\./.test(line);
      const items=[];
      while(i<L.length&&/^\s*([-*+]|\d+\.)\s+/.test(L[i])){
        items.push(L[i].replace(/^\s*([-*+]|\d+\.)\s+/,''));i++;
      }
      const tag=ordered?'ol':'ul';
      out.push('<'+tag+'>'+items.map(t=>'<li>'+inline(t)+'</li>').join('')+'</'+tag+'>');continue;
    }
    const buf=[];
    while(i<L.length&&L[i].trim()&&!/^```|^#{1,6}\s|^\s*\||^>|^\s*([-*+]|\d+\.)\s|^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(L[i])){
      buf.push(L[i]);i++;
    }
    if(!buf.length){i++;continue;}
    out.push('<p>'+inline(buf.join('<br>'))+'</p>');
  }
  return out.join('\n');
}

/* ---------- 列表渲染 ---------- */
function renderChips(){
  const cats=['all','最近','Jack365','Jack','日期笔记','其他'];
  const el=document.getElementById('chips');
  el.innerHTML=cats.map(c=>'<div class="chip'+(curCat===c?' on':'')+'" data-c="'+c+'">'+
    (c==='all'?'全部':c)+'</div>').join('');
  el.querySelectorAll('.chip').forEach(c=>{
    c.onclick=()=>{curCat=c.dataset.c;renderChips();renderList();};
  });
}
function renderList(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const box=document.getElementById('list');
  let arr=files.slice();
  if(curCat==='最近'){
    arr=(S.recent||[]).map(p=>files.find(f=>f.path===p)).filter(Boolean);
  }else if(curCat!=='all'){
    arr=arr.filter(f=>f.cat===curCat);
  }
  if(q){
    arr=arr.filter(f=>f.name.toLowerCase().includes(q)||f.path.toLowerCase().includes(q));
  }
  arr.sort((a,b)=>a.name.localeCompare(b.name,'zh'));

  if(!arr.length){
    box.innerHTML='<div class="empty">'+(q?'没找到「'+esc(q)+'」<br>换个词试试':'这里还没有笔记')+'</div>';
    return;
  }
  if(curCat==='最近'&&!arr.length&&!q){
    box.innerHTML='<div class="empty">还没打开过任何笔记</div>';return;
  }
  box.innerHTML=arr.map(f=>{
    const ico=f.cat==='Jack365'?'365':f.cat==='Jack'?'J':f.cat==='日期笔记'?'日':'·';
    const sub=f.dir?f.dir:'';
    const isNew=f.cat==='Jack365'&&/第1[2-9]\d天/.test(f.name);
    return '<div class="it" data-p="'+f.path.replace(/"/g,'&quot;')+'">'+
      '<div class="ico">'+ico+'</div>'+
      '<div class="nm">'+esc(f.name)+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>'+
      (isNew?'<div class="badge">新</div>':'')+
      '</div>';
  }).join('');
  box.querySelectorAll('.it').forEach(el=>{
    el.onclick=()=>openFile(el.dataset.p);
  });
}

/* ---------- 阅读 ---------- */
function markRecent(path){
  S.recent=[path].concat((S.recent||[]).filter(p=>p!==path)).slice(0,12);
  save();
}
async function openFile(path){
  const rv=document.getElementById('read');
  const art=document.getElementById('art');
  document.getElementById('rTitle').textContent=baseName(path);
  rv.classList.add('on');
  art.scrollTop=0;
  art.innerHTML='<div class="loading"><div class="spin"></div>正在读…</div>';
  try{
    const text=await fetchText(path);
    art.innerHTML=md(text);
    markRecent(path);
    art.querySelectorAll('a.wl').forEach(a=>{
      a.onclick=()=>{
        const t=a.dataset.t.replace(/\.md$/i,'');
        const f=files.find(x=>x.name===t)||files.find(x=>x.name.includes(t))||files.find(x=>t.includes(x.name));
        if(f)openFile(f.path);else toast('库里没有「'+t+'」这个文件');
      };
    });
  }catch(e){
    art.innerHTML='<div class="empty">读不到这个文件<br><br>'+
      (e.message==='AUTH'?'钥匙失效了，去设置里换一个':'网络问题，等会儿再试')+'</div>';
  }
}
function closeRead(){document.getElementById('read').classList.remove('on');}

/* ---------- 主流程 ---------- */
async function boot(){
  load();
  if(!S.token){showSetup();renderChips();document.getElementById('list').innerHTML=
    '<div class="empty">还没设置钥匙<br>点右上角 ⚙ 开始</div>';return;}
  document.getElementById('list').innerHTML='<div class="loading"><div class="spin"></div>正在连仓库…</div>';
  try{
    files=await fetchFiles();
    window.__files=files;
    renderChips();renderList();
    document.getElementById('barTitle').textContent='我的思想库 · '+files.length+' 篇';
  }catch(e){
    document.getElementById('list').innerHTML='<div class="empty">连不上<br><br>'+
      (e.message==='AUTH'?'钥匙失效或权限不够，点 ⚙ 换一个':esc(e.message))+'</div>';
  }
}
function showSetup(){
  document.getElementById('inRepo').value=S.repo||DEF.repo;
  document.getElementById('inTok').value=S.token||'';
  document.getElementById('setup').classList.add('on');
}
function hideSetup(){document.getElementById('setup').classList.remove('on');}
function msg(t,cls){
  const m=document.getElementById('msg');
  m.className=cls;m.innerHTML=t;
}

document.getElementById('btnSave').onclick=async function(){
  const repo=document.getElementById('inRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'');
  const tok=document.getElementById('inTok').value.trim();
  if(!repo||!tok){msg('两栏都要填。','err');return;}
  S.repo=repo;S.token=tok;save();
  msg('正在连…','ok');
  try{
    const f=await fetchFiles();
    msg('成功，读到 '+f.length+' 篇笔记。','ok');
    files=f;renderChips();renderList();
    document.getElementById('barTitle').textContent='我的思想库 · '+f.length+' 篇';
    setTimeout(hideSetup,600);
  }catch(e){
    msg(e.message==='AUTH'
      ? '这个钥匙读不到仓库。检查两件事：①token 有没有勾 <b>repo</b> 权限 ②仓库名有没有写错（要带用户名）'
      : '连不上：'+esc(e.message),'err');
  }
};
document.getElementById('btnSkip').onclick=hideSetup;
document.getElementById('btnSet').onclick=showSetup;
document.getElementById('btnRefresh').onclick=function(){
  cache={};boot();toast('重新拉取中…');
};
function cycleFont(){
  const seq=[15,17,19,21];
  let k=seq.indexOf(S.fs);if(k<0)k=1;
  S.fs=seq[(k+1)%seq.length];save();applyFont();
  toast('字号 '+S.fs);
}
document.getElementById('btnFont').onclick=cycleFont;
document.getElementById('btnFont2').onclick=cycleFont;
document.getElementById('btnBack').onclick=closeRead;
document.getElementById('q').oninput=function(){renderList();};

/* 长按顶栏标题切深浅色 */
let pt=null;
document.getElementById('barTitle').addEventListener('touchstart',function(){pt=setTimeout(function(){
  S.theme=S.theme==='light'?'dark':'light';save();applyTheme();toast('已切换'+(S.theme==='light'?'浅色':'深色'));
},700);},{passive:true});
document.getElementById('barTitle').addEventListener('touchend',function(){clearTimeout(pt);});
document.getElementById('barTitle').addEventListener('touchmove',function(){clearTimeout(pt);});

/* 浏览器返回键关阅读页 */
history.replaceState({v:'list'},'');
window.addEventListener('popstate',function(){
  const rv=document.getElementById('read');
  if(rv.classList.contains('on')){closeRead();history.pushState({v:'list'},'');}
  else if(document.getElementById('setup').classList.contains('on')){hideSetup();history.pushState({v:'list'},'');}
});

boot();
</script>
</body>
</html>
