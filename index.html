<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>我的思想库</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0f1115; --sf:#181b22; --sf2:#20242e; --bd:#272c38;
  --tx:#e8eaf0; --tx2:#9aa3b6; --tx3:#6b7386;
  --ac:#4a7bf7; --acb:rgba(74,123,247,.14);
  --rd:#e0554f; --rdb:rgba(224,85,79,.14);
  --gn:#2fb47c; --gnb:rgba(47,180,124,.14);
  --yl:#d99b28; --ylb:rgba(217,155,40,.15);
  --fs:17px;
}
body.light{
  --bg:#f2f3f6; --sf:#ffffff; --sf2:#eef0f4; --bd:#e2e5ec;
  --tx:#1a1d24; --tx2:#5b6478; --tx3:#8b93a5;
  --ac:#2b5fd9; --acb:rgba(43,95,217,.10);
  --rd:#c0382f; --rdb:rgba(192,56,47,.10);
  --gn:#1f8f5f; --gnb:rgba(31,143,95,.12);
  --yl:#a87715; --ylb:rgba(168,119,21,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}

/* 顶栏 */
#bar{position:sticky;top:0;z-index:30;background:rgba(15,17,21,.86);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
body.light #bar{background:rgba(242,243,246,.88)}
#bar .ttl{font-size:15px;font-weight:600;letter-spacing:.3px;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ib{width:36px;height:36px;flex:0 0 36px;border-radius:10px;border:1px solid var(--bd);
  background:var(--sf);color:var(--tx2);display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;transition:.15s}
.ib:active{transform:scale(.92);background:var(--sf2)}

/* 搜索 */
#sersec{padding:12px 14px 2px}
#sw{position:relative}
#q{width:100%;padding:11px 38px 11px 14px;border-radius:12px;border:1px solid var(--bd);
  background:var(--sf);color:var(--tx);font-size:15px;outline:none;font-family:inherit}
#q::placeholder{color:var(--tx3)}
#q:focus{border-color:var(--ac)}
#clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:20px;height:20px;
  border-radius:50%;background:var(--sf2);color:var(--tx3);display:none;align-items:center;
  justify-content:center;font-size:12px;border:0;cursor:pointer}
#clr.on{display:flex}
#hint{font-size:11.5px;color:var(--tx3);padding:7px 2px 0;display:none}
#hint.on{display:block}
#hint b{color:var(--tx2);font-weight:500}

/* chips */
#chips{display:flex;gap:8px;padding:10px 14px 4px;overflow-x:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);
  mask-image:linear-gradient(90deg,#000 92%,transparent)}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--bd);
  background:var(--sf);color:var(--tx2);font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.chip.on{background:var(--acb);border-color:var(--ac);color:var(--ac);font-weight:600}

/* 列表 */
#list{padding:6px 12px calc(env(safe-area-inset-bottom) + 44px)}
.grp{display:flex;align-items:center;gap:8px;padding:18px 6px 6px;cursor:pointer}
.grp .gnm{font-size:11.5px;color:var(--tx2);letter-spacing:1.2px;font-weight:600}
.grp .gc{font-size:10.5px;color:var(--tx3);opacity:.85}
.grp .gline{flex:1;height:1px;background:var(--bd)}
.grp .garw{font-size:10px;color:var(--tx3);transition:.2s}
.grp.fold .garw{transform:rotate(-90deg)}
.it{display:flex;gap:11px;align-items:flex-start;padding:10px 6px;border-radius:10px;cursor:pointer}
.it:active{background:var(--sf2)}
.it .ico{width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--tx3);
  font-weight:600;letter-spacing:-.3px}
.ico.r{background:var(--rdb);color:var(--rd)}
.ico.b{background:var(--acb);color:var(--ac)}
.ico.g{background:var(--gnb);color:var(--gn)}
.ico.y{background:var(--ylb);color:var(--yl)}
.it .nm{flex:1;min-width:0;font-size:14.5px;line-height:1.45;color:var(--tx);
  word-break:break-word}
.it .sub{font-size:11px;color:var(--tx3);margin-top:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.it .bdg{font-size:10px;padding:2px 6px;border-radius:5px;background:var(--sf2);
  color:var(--tx3);flex:0 0 auto;margin-top:3px}
.more{display:block;width:100%;margin:14px 0 0;padding:11px;border-radius:11px;
  border:1px solid var(--bd);background:var(--sf);color:var(--tx2);font-size:13px;cursor:pointer}
.empty{text-align:center;color:var(--tx3);font-size:13.5px;line-height:2;padding:52px 24px}
.empty .k{color:var(--tx2)}
.nomeet{font-size:12.5px;color:var(--tx3);padding:18px 6px 2px}
.loading{text-align:center;color:var(--tx3);font-size:13px;padding:44px}
.spin{width:22px;height:22px;border:2px solid var(--bd);border-top-color:var(--ac);
  border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 正文搜索结果 */
.sec{font-size:11px;color:var(--tx3);letter-spacing:1.2px;font-weight:600;padding:20px 6px 8px}
.hit{padding:10px 6px;border-radius:10px;cursor:pointer}
.hit:active{background:var(--sf2)}
.hit .hp{font-size:14.5px;line-height:1.45}
.hit .hs{font-size:12px;color:var(--tx2);line-height:1.7;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hit .hs mark{background:var(--ylb);color:var(--yl);padding:0 2px;border-radius:3px}

/* 阅读页 */
#read{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;
  flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
#read.on{display:flex;transform:translateX(0)}
#rbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;border-bottom:1px solid var(--bd);
  background:rgba(15,17,21,.86);backdrop-filter:blur(14px)}
body.light #rbar{background:rgba(242,243,246,.9)}
#rbar .ttl{flex:1;font-size:13.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#art{flex:1;overflow-y:auto;padding:18px 18px calc(env(safe-area-inset-bottom) + 60px);
  font-size:var(--fs);line-height:1.9;word-break:break-word;-webkit-overflow-scrolling:touch}
#art h1,#art h2,#art h3,#art h4{margin:1.4em 0 .55em;line-height:1.4;font-weight:650;scroll-margin-top:14px}
#art h1{font-size:1.35em}#art h2{font-size:1.2em}#art h3{font-size:1.08em}#art h4{font-size:1em;color:var(--tx2)}
#art p{margin:.75em 0}
#art a.wl{color:var(--ac);text-decoration:none;border-bottom:1px dashed var(--ac);cursor:pointer}
#art a{color:var(--ac);text-decoration:none}
#art blockquote{margin:.9em 0;padding:8px 14px;border-left:3px solid var(--ac);
  background:var(--sf);border-radius:0 8px 8px 0;color:var(--tx2)}
#art blockquote p{margin:.35em 0}
#art ul,#art ol{padding-left:1.35em;margin:.7em 0}
#art li{margin:.3em 0}
#art hr{border:0;border-top:1px solid var(--bd);margin:1.6em 0}
#art code{background:var(--sf2);padding:.14em .4em;border-radius:5px;font-size:.9em}
#art pre{background:var(--sf);border:1px solid var(--bd);border-radius:10px;
  padding:12px;overflow-x:auto;font-size:.86em;line-height:1.6}
#art pre code{background:none;padding:0}
#art img{max-width:100%;border-radius:8px}
#art table{border-collapse:collapse;width:100%;font-size:.9em;margin:.8em 0}
#art th,#art td{border:1px solid var(--bd);padding:6px 9px;text-align:left}
#art th{background:var(--sf2);font-weight:600}
#art .tw{overflow-x:auto}
#art strong{color:var(--tx);font-weight:650}

/* 设置页 */
#setup{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 26px) 20px 60px;display:none}
#setup.on{display:block}
#setup h1{font-size:20px;margin:0 0 10px}
#setup .lead{font-size:13px;color:var(--tx2);line-height:1.8;margin:0 0 22px}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:7px}
.fld input{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--bd);
  background:var(--sf);color:var(--tx);font-size:14px;outline:none;font-family:inherit}
.fld input:focus{border-color:var(--ac)}
.hint{font-size:11.5px;color:var(--tx3);line-height:1.8;margin-top:8px}
.hint a{color:var(--ac)}
.btn{display:block;width:100%;padding:12px;border-radius:11px;border:0;background:var(--ac);
  color:#fff;font-size:14.5px;font-weight:600;margin-top:12px;cursor:pointer;font-family:inherit}
.btn.gh{background:var(--sf);color:var(--tx2);border:1px solid var(--bd);font-weight:400}
#msg{font-size:12.5px;margin-top:12px;line-height:1.7}
#msg.err{color:var(--rd)}
#diagBox{display:none;margin-top:14px;padding:13px;border-radius:11px;background:var(--sf);
  border:1px solid var(--bd);font-size:12px;line-height:1.9;color:var(--tx2)}
#diagBox.on{display:block}
.toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);z-index:99;
  background:rgba(30,33,40,.95);color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;
  max-width:80%;text-align:center;line-height:1.5}

/* 思想实验卡片 / 读书按天 */
.lead{font-size:11.5px;color:var(--tx3);letter-spacing:1.2px;padding:14px 6px 10px;font-weight:600}
.dcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{border:1px solid var(--bd);border-radius:14px;background:var(--sf);padding:12px;
  cursor:pointer;transition:transform .12s,background .15s;min-height:88px;display:flex;
  flex-direction:column;justify-content:space-between}
.dcard:active{transform:scale(.97);background:var(--sf2)}
.dcard .dn{font-size:11px;color:var(--rd);font-weight:600;letter-spacing:.4px}
.dcard .dt{font-size:14px;line-height:1.45;color:var(--tx);margin-top:8px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bk{margin:0 0 14px}
.bkh{display:flex;align-items:center;gap:9px;padding:13px 12px;border-radius:13px;
  background:var(--sf);border:1px solid var(--bd);cursor:pointer}
.bkh:active{background:var(--sf2)}
.bkh .arw{font-size:10px;color:var(--tx3);transition:.2s}
.bkn{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--tx);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkc{font-size:11px;color:var(--tx3);flex:0 0 auto}
.bk.fold .bkh .arw{transform:rotate(-90deg)}
.bkl{font-size:12px;color:var(--tx3);padding:14px 12px}
.drow{display:flex;gap:11px;align-items:flex-start;padding:11px 10px;border-radius:11px;cursor:pointer}
.drow:active{background:var(--sf2)}
.dn2{margin-top:1px;flex:0 0 28px;height:28px;border-radius:9px;background:var(--rdb);color:var(--rd);
  font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
.dn2.g{background:var(--gnb);color:var(--gn)}
.dbody{flex:1;min-width:0}
.dtt{display:block;font-size:14px;line-height:1.4;color:var(--tx);word-break:break-word}
.ddate{display:block;font-size:11px;color:var(--tx3);margin-top:3px}
.dgo{flex:0 0 auto;color:var(--tx3);font-size:16px}
.chip .cn{font-size:10px;opacity:.65;margin-left:5px}

/* 书卡片 / 书详情 */
.bcard{margin:0 0 12px;padding:15px 14px;border-radius:15px;border:1px solid var(--bd);
  background:var(--sf);cursor:pointer;transition:transform .12s,background .15s}
.bcard:active{transform:scale(.985);background:var(--sf2)}
.bc-top{display:flex;align-items:baseline;gap:8px}
.bc-n{flex:1;min-width:0;font-size:16px;font-weight:650;color:var(--tx);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-c{font-size:12px;color:var(--gn);font-weight:600;flex:0 0 auto}
.bc-a{font-size:16px;color:var(--tx3);flex:0 0 auto;margin-left:2px}
.bc-s{font-size:11.5px;color:var(--tx3);margin-top:6px}
.bback{display:inline-block;font-size:13px;color:var(--tx2);padding:14px 6px 10px;cursor:pointer}
.bhead{margin:0 0 10px;padding:15px 14px 14px;border-radius:15px;
  border:1px solid var(--bd);background:var(--sf)}
.bh-n{font-size:18px;font-weight:650;color:var(--tx)}
.bh-m{font-size:12px;color:var(--tx3);margin-top:7px}
.bh-note{font-size:12px;color:var(--tx2);margin-top:8px;line-height:1.7;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bh-open{margin-top:12px;font-size:12.5px;color:var(--ac);cursor:pointer}
</style>
</head>
<body>

<div id="bar">
  <div class="ttl" id="barTitle">我的思想库</div>
  <div class="ib" id="btnRefresh" title="刷新">↻</div>
  <div class="ib" id="btnFont" title="字号">A</div>
  <div class="ib" id="btnSet" title="设置">⚙</div>
</div>

<div id="sersec">
  <div id="sw">
    <input id="q" type="search" name="kw_search" placeholder="搜标题或正文，比如：缓冲、机制、安全感" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="clr" aria-label="清空">✕</button>
  </div>
  <div id="hint"></div>
</div>
<div id="chips"></div>
<div id="list"><div class="loading"><div class="spin"></div>正在连仓库…</div></div>

<div id="read">
  <div id="rbar">
    <div class="ib" id="btnBack">‹</div>
    <div class="ttl" id="rTitle"></div>
    <div class="ib" id="btnFont2">A</div>
  </div>
  <article id="art"></article>
</div>

<div id="setup">
  <h1>一次性设置</h1>
  <p class="lead">这东西只做一件事：把你在 GitHub 私人仓库里的笔记，变成一个点开就能看的列表。<br>下面的 key 只存在你这台手机里，不会上传到任何地方。</p>

  <div class="fld">
    <label>1. 仓库名</label>
    <input id="inRepo" placeholder="wdfxf/p-life-system" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="hint">格式是 用户名/仓库名。默认已经填好了，不用改。</div>
  </div>

  <div class="fld">
    <label>2. 访问钥匙（Token）</label>
    <input id="inTok" type="password" placeholder="ghp_... 或 github_pat_..." autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="hint">
      没有的话点这里去生成：<a href="https://github.com/settings/tokens/new?scopes=repo&description=my-notes-reader" target="_blank">github.com/settings/tokens/new</a><br>
      · Note 随便填，比如 reader<br>
      · Expiration 选 90 days 或 No expiration<br>
      · 下面勾选框只勾第一个 <b>repo</b><br>
      · 拉到底点绿色 Generate token，复制那串字符粘到上面
    </div>
  </div>

  <button class="btn" id="btnSave">保存并试试能不能读到</button>
  <button class="btn gh" id="btnDiag">连不上？点这里一步步诊断</button>
  <button class="btn gh" id="btnSkip">先看看界面（没钥匙读不到内容）</button>
  <div id="msg"></div>
  <div id="diagBox"></div>
</div>

<script>
'use strict';
const KEY='wbreader_v2';
const DEF={repo:'wdfxf/p-life-system',token:'',fs:17,theme:'dark',recent:[],cat:'all'};
let S=Object.assign({},DEF);
let files=[], cache={}, curCat='all', folded={}, shown=300, contentHits=null, searching=false;

/* ---------- 存储 ---------- */
function load(){
  try{const j=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('wbreader_v1')||'{}');
    S=Object.assign({},DEF,j);}catch(e){S=Object.assign({},DEF);}
  applyTheme();applyFont();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function applyTheme(){document.body.classList.toggle('light',S.theme==='light');
  const m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute('content',S.theme==='light'?'#f2f3f6':'#0f1115');}
function applyFont(){document.documentElement.style.setProperty('--fs',S.fs+'px');}

/* ---------- 工具 ---------- */
function toast(t,ms){
  const d=document.createElement('div');d.className='toast';d.textContent=t;
  document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2200);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function encPath(p){return p.split('/').map(encodeURIComponent).join('/');}
function normRepo(v){
  let s=(v||'').trim()
    .replace(/^https?:\/\/github\.com\//i,'')
    .replace(/^github\.com\//i,'')
    .replace(/\.git$/i,'')
    .replace(/[／]/g,'/')
    .replace(/\/+$/,'')
    .replace(/\s+/g,'');
  if(s&&s.indexOf('/')<0)s='wdfxf/'+s;
  return s;
}
function baseName(p){return p.split('/').pop().replace(/\.md$/i,'');}
function catOf(p){
  const parts=p.split('/');
  if(parts.length>1)return parts[0];
  if(/^Jack 365/.test(p))return 'Jack 365';
  if(/^Jack启蒙/.test(p))return 'Jack启蒙';
  if(/^Jack/.test(p))return 'Jack读书';
  if(/^\d{4}-\d{2}-\d{2}/.test(p))return '日期笔记';
  return '根目录';
}
function icoOf(cat){
  if(cat==='Jack 365')return {t:'365',c:'r'};
  if(cat==='Jack启蒙')return {t:'启',c:'b'};
  if(cat==='Jack读书')return {t:'书',c:'g'};
  if(cat==='日期笔记')return {t:'日',c:'y'};
  if(cat==='根目录')return {t:'·',c:''};
  return {t:'册',c:''};
}

/* ---------- API ---------- */
async function fetchT(url,opt,ms){
  const c=new AbortController();
  const t=setTimeout(function(){c.abort();},ms||14000);
  try{
    const o=Object.assign({},opt||{});
    o.signal=c.signal;
    return await fetch(url,o);
  }finally{clearTimeout(t);}
}
async function api(path,retryN){
  retryN=(retryN===undefined)?2:retryN;
  let lastErr=null;
  for(let k=0;k<=retryN;k++){
    try{
      const r=await fetchT('https://api.github.com'+path,{
        headers:{'Authorization':'token '+S.token,'Accept':'application/vnd.github+json'}
      });
      if(r.status===401||r.status===403){const e=new Error('AUTH');e.code=r.status;throw e;}
      if(r.status===404){const e=new Error('NOTFOUND');throw e;}
      if(!r.ok){const e=new Error('HTTP '+r.status);e.code=r.status;throw e;}
      return r.json();
    }catch(e){
      lastErr=e;
      if(e.message==='AUTH'||e.message==='NOTFOUND')throw e;
      if(k<retryN)await new Promise(function(s){setTimeout(s,900*(k+1));});
    }
  }
  throw lastErr||new Error('NETWORK');
}

/* ---------- 分步诊断 ---------- */
async function diagnose(repo,tok){
  const lines=[];
  function add(s){lines.push(s);document.getElementById('diagBox').innerHTML=lines.join('<br>');}
  const box=document.getElementById('diagBox');
  box.classList.add('on');box.innerHTML='';

  add('<b>第 1 步 · 手机能不能连上 GitHub</b>');
  let t0=Date.now();
  try{
    const r=await fetchT('https://api.github.com/rate_limit',null,12000);
    if(!r.ok)throw new Error('HTTP '+r.status);
    add('　✅ 通了（'+(Date.now()-t0)+'ms）');
  }catch(e){
    add('　❌ 连不上。这是网络问题，不是钥匙问题。');
    add('');add('<b>怎么办：</b>换一个网络再试——WiFi 换流量，流量换 WiFi。如果还是不行，说明你这边访问 GitHub 被限制了，钥匙再怎么填都没用。');
    return;
  }
  add('<b>第 2 步 · 钥匙是不是有效的</b>');
  try{
    const r=await fetchT('https://api.github.com/user',{headers:{'Authorization':'token '+tok}},12000);
    if(r.status===401){add('　❌ 钥匙无效。多半是复制时漏了字符，或者已经过期/被删。重新生成一个再粘。');return;}
    if(!r.ok){add('　❌ 返回 '+r.status+'，先按无效处理，重新生成一个。');return;}
    const u=await r.json();
    add('　✅ 有效，账号是 <b>'+esc(u.login)+'</b>');
  }catch(e){add('　❌ 检查时出错：'+esc(e.message));return;}

  add('<b>第 3 步 · 这个钥匙能不能读你的仓库</b>');
  try{
    const r=await fetchT('https://api.github.com/repos/'+repo,{headers:{'Authorization':'token '+tok}},12000);
    if(r.status===404){
      add('　❌ 读不到 <b>'+esc(repo)+'</b>');add('　两种可能：');
      add('　① 仓库名写错了（要带用户名，格式 用户名/仓库名）');
      add('　② 生成钥匙时没勾 <b>repo</b> 权限，或者 fine-grained 钥匙没选中这个仓库');
      return;
    }
    if(r.status===403){add('　❌ 无权限（403）。重新生成钥匙，勾上 repo。');return;}
    if(!r.ok){add('　❌ 返回 '+r.status);return;}
    const j=await r.json();
    add('　✅ 可读：<b>'+esc(j.full_name)+'</b>（'+(j.private?'私有':'公开')+'）');
  }catch(e){add('　❌ 出错：'+esc(e.message));return;}

  add('<b>第 4 步 · 能不能列出里面的笔记</b>');
  try{
    const m=await (await fetchT('https://api.github.com/repos/'+repo,{headers:{'Authorization':'token '+tok}},12000)).json();
    const br=m.default_branch||'main';
    const tr=await (await fetchT('https://api.github.com/repos/'+repo+'/git/trees/'+br+'?recursive=1',{headers:{'Authorization':'token '+tok}},20000)).json();
    if(!tr.tree){add('　❌ 拿不到文件树：'+esc(tr.message||'未知错误'));return;}
    const n=tr.tree.filter(function(x){return x.type==='blob'&&/\.md$/i.test(x.path);}).length;
    add('　✅ 读到 <b>'+n+'</b> 篇笔记');
    add('');add('<b>全部通过。现在把设置页关掉，重新进来就有了。</b>');
  }catch(e){add('　❌ 出错：'+esc(e.message));}
}

async function fetchFiles(){
  const meta=await api('/repos/'+S.repo);
  const br=meta.default_branch||'main';
  const tree=await api('/repos/'+S.repo+'/git/trees/'+br+'?recursive=1');
  return (tree.tree||[])
    .filter(x=>x.type==='blob'&&/\.md$/i.test(x.path)&&!/^\./.test(x.path))
    .map(x=>({path:x.path,name:baseName(x.path),dir:x.path.includes('/')?x.path.split('/')[0]:'',cat:catOf(x.path)}));
}

async function fetchText(path){
  if(cache[path]&&Date.now()-cache[path].t<36e5)return cache[path].v;
  const j=await api('/repos/'+S.repo+'/contents/'+encPath(path));
  let text='';
  if(j.content&&j.encoding==='base64'){
    const bin=atob(j.content.replace(/\s/g,''));
    const u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    text=new TextDecoder('utf-8').decode(u);
  }else if(j.download_url){
    const r=await fetch(j.download_url,{headers:{'Authorization':'token '+S.token}});
    text=await r.text();
  }
  cache[path]={v:text,t:Date.now()};
  return text;
}

/* ---------- Markdown ---------- */
function inline(s){
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g,function(_,a,b){
    return '<a class="wl" data-t="'+String(a).trim()+'">'+((b||a)+'')+'</a>';
  });
  s=s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function splitRow(l){
  return l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());
}
function md(src){
  src=src.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/,'');
  const codes=[];
  src=src.replace(/```[^\n]*\n([\s\S]*?)```/g,function(_,c){
    codes.push('<pre><code>'+esc(c.replace(/\n$/,''))+'</code></pre>');return '\u0002'+(codes.length-1)+'\u0003';
  });
  src=src.replace(/`([^`\n]+)`/g,function(_,c){
    codes.push('<code>'+esc(c)+'</code>');return '\u0002'+(codes.length-1)+'\u0003';
  });
  const keep=[];
  src=src.replace(/<\/?(?:span|b|strong|br|i|em|u|sup|sub|font|del)(?:\s[^>]*)?\/?>/gi,function(m){
    keep.push(m);return '\u0000'+(keep.length-1)+'\u0001';
  });
  src=esc(src);
  src=src.replace(/\u0000(\d+)\u0001/g,function(_,i){return keep[+i];});

  const L=src.split(/\r?\n/), out=[]; let i=0;
  while(i<L.length){
    const line=L[i];
    if(/^\s*\u0002\d+\u0003\s*$/.test(line)){out.push(line.trim());i++;continue;}
    if(/^```/.test(line)){
      const buf=[];i++;
      while(i<L.length&&!/^```/.test(L[i])){buf.push(L[i]);i++;}
      i++;out.push('<pre><code>'+buf.join('\n')+'</code></pre>');continue;
    }
    if(!line.trim()){i++;continue;}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){out.push('<hr>');i++;continue;}
    let m=line.match(/^(#{1,6})\s+(.*)$/);
    if(m){const n=m[1].length;out.push('<h'+n+'>'+inline(m[2])+'</h'+n+'>');i++;continue;}
    if(/^\s*\|/.test(line)&&i+1<L.length&&/^\s*\|[\s:|-]+\|?\s*$/.test(L[i+1])){
      const head=splitRow(line);i+=2;const rows=[];
      while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(splitRow(L[i]));i++;}
      out.push('<div class="tw"><table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+
        '</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+
        '</tbody></table></div>');continue;
    }
    if(/^(&gt;|>)\s?/.test(line)){
      const buf=[];
      while(i<L.length&&/^(&gt;|>)\s?/.test(L[i])){buf.push(L[i].replace(/^(&gt;|>)\s?/,''));i++;}
      const paras=[];let cp=[];
      buf.forEach(function(t){
        if(!t.trim()){if(cp.length){paras.push(cp.join('<br>'));cp=[];}}
        else cp.push(t);
      });
      if(cp.length)paras.push(cp.join('<br>'));
      if(!paras.length)paras.push('');
      out.push('<blockquote>'+paras.map(function(p){return '<p>'+inline(p)+'</p>';}).join('')+'</blockquote>');
      continue;
    }
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      const ordered=/^\s*\d+\./.test(line);const items=[];
      while(i<L.length&&/^\s*([-*+]|\d+\.)\s+/.test(L[i])){
        items.push(L[i].replace(/^\s*([-*+]|\d+\.)\s+/,''));i++;
      }
      const tag=ordered?'ol':'ul';
      out.push('<'+tag+'>'+items.map(t=>'<li>'+inline(t)+'</li>').join('')+'</'+tag+'>');continue;
    }
    const buf=[];
    while(i<L.length&&L[i].trim()&&!/^```|^#{1,6}\s|^\s*\||^>|^\s*([-*+]|\d+\.)\s|^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(L[i])){
      buf.push(L[i]);i++;
    }
    if(!buf.length){i++;continue;}
    out.push('<p>'+inline(buf.join('<br>'))+'</p>');
  }
  let html=out.join('\n');
  html=html.replace(/\u0002(\d+)\u0003/g,function(_,i){return codes[+i];});
  return html;
}

/* ---------- 数据模型：只有两条线 ---------- */
/* 思想实验 = Jack 365 的每一天；读书 = 每本书，书里再分天 */
let expDays=[], books=[], mode='exp', curBook=null;

function buildExp(){
  const re=/^Jack 365 第(\d+)天[ 　]*(.+)\.md$/;
  expDays=files.map(f=>{
    const m=f.path.match(re);
    return m?{path:f.path,n:+m[1],title:m[2].trim()}:null;
  }).filter(Boolean).sort((a,b)=>b.n-a.n);
}
function buildBooks(){
  books=files
    .filter(f=>/^Jack读书\//.test(f.path)&&!/^Jack读书\/Jack读书\.md$/.test(f.path))
    .map(f=>({path:f.path,name:f.name.replace(/^Jack·/,''),days:[],loaded:false}))
    .sort((a,b)=>a.name.localeCompare(b.name,'zh'));
}
/* 从「共读进度」的 [[文件#第 N 天 · 日期 · 标题|别名]] 里抓天 */
function parseDays(text){
  const out=[], seen={};
  text.split(/\r?\n/).forEach(l=>{
    const m=l.match(/^\s*[-*]\s*\[\[([^\]|]*)#([^|\]]+)\|([^\]]+)\]\]/);
    if(!m)return;
    const anchor=m[2].trim();
    const d=anchor.match(/^第\s*(\d+)\s*天/);
    if(!d||seen[d[1]])return;
    seen[d[1]]=1;
    const parts=anchor.split('·').map(s=>s.trim());
    const date=/^\d{4}-\d{2}-\d{2}$/.test(parts[1]||'')?parts[1]:'';
    let title=parts.length>2?parts.slice(2).join(' · '):'';
    if(!title){
      const al=m[3].split('·');
      title=al[al.length-1].trim();
    }
    out.push({n:+d[1],date:date,title:title,anchor:'第 '+d[1]+' 天'});
  });
  return out.sort((a,b)=>a.n-b.n);
}
async function loadBooks(){
  await Promise.all(books.map(async b=>{
    try{
      const t=await fetchText(b.path);
      b.days=parseDays(t);
      const m=t.match(/^共读:\s*(.+)$/m);b.note=m?m[1].trim():'';
    }catch(e){b.days=[];}
    b.loaded=true;
  }));
  if(S.recent){/* 占位，保持结构 */}
}

function renderChips(){
  const el=document.getElementById('chips');

    it[1]+'<span class="cn">'+it[2]+'</span></div>').join('');
  el.querySelectorAll('.chip').forEach(c=>{
    c.onclick=()=>{mode=c.dataset.m;curBook=null;renderChips();renderList();window.scrollTo(0,0);};
  });
}

function renderList(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const box=document.getElementById('list');
  document.getElementById('clr').classList.toggle('on',!!q);
  if(q){renderSearch(q);return;}
  if(!expDays.length&&!books.length){
    box.innerHTML='<div class="empty">'+(S.token?'仓库里没读到东西':'还没设置钥匙')+'</div>';
    return;

function expHTML(){
  if(!expDays.length)return '<div class="empty">还没有思想实验</div>';
  return '<div class="lead">最新在上 · 共 '+expDays.length+' 天</div>'+
    '<div class="dcards">'+expDays.map(d=>
      '<div class="dcard" data-p="'+esc(d.path)+'">'+
        '<div class="dn">第 '+d.n+' 天</div>'+
        '<div class="dt">'+esc(d.title)+'</div>'+
      '</div>').join('')+'</div>';
}

function bookHTML(){
  if(!books.length)return '<div class="empty">还没有读书档案</div>';
  const total=books.reduce((n,b)=>n+b.days.length,0);
  return '<div class="lead">'+books.length+' 本 · 共 '+total+' 天</div>'+
    books.map(b=>{
      const ds=b.days.filter(d=>d.date);
      const range=!ds.length?'':(ds[0].date===ds[ds.length-1].date?ds[0].date:ds[0].date+' – '+ds[ds.length-1].date);
      return '<div class="bcard" data-bk="'+esc(b.path)+'">'+
        '<div class="bc-top"><span class="bc-n">《'+esc(b.name)+'》</span>'+
          '<span class="bc-c">'+(b.loaded?b.days.length+' 天':'…')+'</span>'+
          '<span class="bc-a">›</span></div>'+
        (range?'<div class="bc-s">'+esc(range)+'</div>':'')+
      '</div>';
    }).join('');
}
function bookDetailHTML(b){
  const ds=b.days.filter(d=>d.date);
  const range=!ds.length?'':(ds[0].date===ds[ds.length-1].date?ds[0].date:ds[0].date+' – '+ds[ds.length-1].date);
  return '<div class="bback" data-back="1">‹ 全部书</div>'+
    '<div class="bhead">'+
      '<div class="bh-n">《'+esc(b.name)+'》</div>'+
      '<div class="bh-m">'+(b.loaded?b.days.length+' 天':'')+(range?' · '+esc(range):'')+'</div>'+
      (b.note&&!/^第\s*\d+\s*天$/.test(b.note)?'<div class="bh-note">'+esc(b.note)+'</div>':'')+
      '<div class="bh-open" data-p="'+esc(b.path)+'">看这本书的原文 ›</div>'+
    '</div>'+
    (b.loaded?(b.days.length?b.days.map(d=>dayRow(b,d)).join(''):'<div class="bkl">这本还没收天</div>')
      :'<div class="bkl">正在读目录…</div>');
}
function dayRow(b,d){
  return '<div class="drow" data-p="'+esc(b.path)+'" data-a="'+esc(d.anchor)+'">'+
    '<span class="dn2 g">'+d.n+'</span>'+
    '<span class="dbody"><span class="dtt">'+esc(d.title)+'</span>'+
      (d.date?'<span class="ddate">'+d.date+'</span>':'<span class="ddate">日期未显示</span>')+
    '</span><span class="dgo">›</span></div>';
}

function renderSearch(q){
  const box=document.getElementById('list');
  const eHit=expDays.filter(d=>('第'+d.n+'天 '+d.title).toLowerCase().includes(q)||String(d.n)===q);
  const bHit=[];
  books.forEach(b=>b.days.forEach(d=>{
    if(('第'+d.n+'天 '+d.title).toLowerCase().includes(q))bHit.push({b:b,d:d});
  }));
  let html='';
  if(eHit.length||bHit.length){
    html+='<div class="sec">标题匹配 '+(eHit.length+bHit.length)+' 条</div>';
    if(eHit.length)html+=eHit.slice(0,80).map(d=>
      '<div class="drow" data-p="'+esc(d.path)+'">'+
        '<span class="dn2">'+d.n+'</span><span class="dbody">'+
        '<span class="dtt">'+esc(d.title)+'</span>'+
        '<span class="ddate">思想实验 · 第 '+d.n+' 天</span></span><span class="dgo">›</span></div>').join('');
    if(bHit.length)html+=bHit.slice(0,80).map(x=>
      '<div class="drow" data-p="'+esc(x.b.path)+'" data-a="'+esc(x.d.anchor)+'">'+
        '<span class="dn2 g">'+x.d.n+'</span><span class="dbody">'+
        '<span class="dtt">'+esc(x.d.title)+'</span>'+
        '<span class="ddate">《'+esc(x.b.name)+'》· 第 '+x.d.n+' 天</span></span><span class="dgo">›</span></div>').join('');
  }else{
    html+='<div class="nomeet">标题里没有「'+esc(q)+'」，往下看正文里有没有</div>';
  }
  html+='<div id="hits"></div>';
  box.innerHTML=html;
  bindItems(box);
}

function bindItems(root){
  root.querySelectorAll('[data-p]').forEach(el=>{
    el.onclick=(ev)=>{ev.stopPropagation();openFile(el.dataset.p,el.dataset.a||'');};
  });
  root.querySelectorAll('[data-bk]').forEach(el=>{
    el.onclick=(ev)=>{ev.stopPropagation();
      curBook=books.filter(b=>b.path===el.dataset.bk)[0]||null;
      renderList();window.scrollTo(0,0);};
  });
  root.querySelectorAll('[data-back]').forEach(el=>{
    el.onclick=(ev)=>{ev.stopPropagation();curBook=null;renderList();window.scrollTo(0,0);};
  });
}

/* ---------- 正文搜索 ---------- */
async function contentSearch(q){
  const box=document.getElementById('hits');
  if(!box)return;
  if(contentHits&&contentHits.q===q){paintHits(contentHits);return;}
  if(searching&&searching===q)return;
  searching=q;
  box.innerHTML='<div class="loading"><div class="spin"></div>正在翻正文…</div>';
  try{
    const url='https://api.github.com/search/code?q='+encodeURIComponent(q+' repo:'+S.repo)+
      '&per_page=20';
    const r=await fetchT(url,{
      headers:{'Authorization':'token '+S.token,
        'Accept':'application/vnd.github.text-match+json'}
    },20000);
    if(r.status===401||r.status===403)throw new Error('AUTH');
    if(r.status===422)throw new Error('QUERY');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const items=(j.items||[]).map(it=>({
      path:it.path,name:baseName(it.path),
      frag:(it.text_matches&&it.text_matches[0]&&it.text_matches[0].fragment)||''
    }));
    contentHits={q:q,items:items,total:j.total_count||items.length};
    paintHits(contentHits);
  }catch(e){
    box.innerHTML='<div class="empty" style="padding:28px 20px;font-size:12.5px">'+
      '正文搜索这次没成功'+(e.message==='AUTH'?'（钥匙权限不够）':'')+'<br>'+
      '<span class="k">可以换个更短的词，或只搜标题</span></div>';
  }finally{searching=null;}
}
function paintHits(h){
  const box=document.getElementById('hits');
  if(!box)return;
  if(!h.items.length){
    box.innerHTML='<div class="empty" style="padding:34px 20px">正文里也没有「'+esc(h.q)+'」<br>'+
      '<span class="k">试试更短的一两个词</span></div>';
    return;
  }
  const qe=esc(h.q);
  const re=new RegExp('('+qe.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  box.innerHTML='<div class="sec">正文匹配 '+h.total+' 篇</div>'+
    h.items.map(it=>{
      let frag=String(it.frag||'')
        .replace(/\[\[([^\]|]*)\|([^\]]+)\]\]/g,'$2')
        .replace(/[*_`>#]+/g,' ')
        .replace(/\s+/g,' ').trim();
      frag=esc(frag).replace(re,'<mark>$1</mark>');
      return '<div class="hit" data-p="'+esc(it.path)+'">'+
        '<div class="hp">'+esc(it.name)+'</div>'+
        (frag?'<div class="hs">'+frag+'</div>':'')+'</div>';
    }).join('');
  box.querySelectorAll('.hit').forEach(el=>el.onclick=()=>openFile(el.dataset.p));
}

/* ---------- 阅读 ---------- */
function markRecent(path){
  S.recent=[path].concat((S.recent||[]).filter(p=>p!==path)).slice(0,30);
  save();
}
async function openFile(path,anchor){
  const f=files.find(x=>x.path===path);
  document.getElementById('rTitle').textContent=f?f.name:baseName(path);
  document.getElementById('read').classList.add('on');
  const art=document.getElementById('art');
  art.scrollTop=0;
  art.innerHTML='<div class="loading"><div class="spin"></div>正在读…</div>';
  try{
    const text=await fetchText(path);
    art.innerHTML=md(text);
    markRecent(path);
    if(anchor){
      const key=String(anchor).replace(/\s/g,'');
      const hs=art.querySelectorAll('h1,h2,h3,h4');
      for(let i=0;i<hs.length;i++){
        if(hs[i].textContent.replace(/\s/g,'').indexOf(key)===0){hs[i].scrollIntoView({block:'start'});break;}
      }
    }
    art.querySelectorAll('a.wl').forEach(a=>{
      a.onclick=()=>{
        const t=a.dataset.t.replace(/\.md$/i,'').split('/').pop();
        const g=files.find(x=>x.name===t)||files.find(x=>x.name.includes(t))||files.find(x=>t.includes(x.name));
        if(g)openFile(g.path);else toast('库里没有「'+t+'」这个文件');
      };
    });
  }catch(e){
    art.innerHTML='<div class="empty">读不到这个文件<br><br>'+
      (e.message==='AUTH'?'钥匙失效了，去设置里换一个':'网络问题，等会儿再试')+'</div>';
  }
}
function closeRead(){document.getElementById('read').classList.remove('on');}

function setTitle(){
  const bd=books.reduce((s,b)=>s+b.days.length,0);
  const ok=books.length&&books.every(b=>b.loaded);
  document.getElementById('barTitle').textContent=
    '思想实验 '+expDays.length+' 天 · 读书 '+(ok?bd+' 天':books.length+' 本');
}

/* ---------- 主流程 ---------- */
async function boot(){
  load();
  /* 关键修复：清掉被浏览器自动填进来的仓库名 */
  const qEl=document.getElementById('q');
  if(qEl.value&&qEl.value.indexOf('/')>=0)qEl.value='';
  if(qEl.value.trim())qEl.value='';

  if(!S.token){showSetup();renderChips();
    document.getElementById('list').innerHTML='<div class="empty">还没设置钥匙<br>点右上角 ⚙ 开始</div>';return;}
  document.getElementById('list').innerHTML='<div class="loading"><div class="spin"></div>正在连仓库…</div>';
  try{
    files=await fetchFiles();
    buildExp();buildBooks();
    renderChips();renderList();setTitle();
    loadBooks().then(()=>{renderChips();if(mode==='book')renderList();setTitle();});
  }catch(e){
    let why='';
    if(e&&e.name==='AbortError')why='网络超时了';
    else if(e&&e.message==='AUTH')why='钥匙失效或权限不够';
    else if(e&&e.message==='NOTFOUND')why='仓库名读不到';
    else why='网络不通';
    document.getElementById('list').innerHTML='<div class="empty">'+why+'<br><br>点右上角 ⚙ 进去，再点「连不上？点这里一步步诊断」</div>';
  }
}
function showSetup(){
  document.getElementById('inRepo').value=S.repo||DEF.repo;
  document.getElementById('inTok').value=S.token||'';
  document.getElementById('setup').classList.add('on');
  document.getElementById('btnSkip').textContent='关闭设置';
}

/* ---------- 绑定 ---------- */
document.getElementById('btnSet').onclick=()=>{
  document.getElementById('msg').textContent='';
  document.getElementById('btnSkip').textContent='先看看界面（没钥匙读不到内容）';
  showSetup();
};
document.getElementById('btnSkip').onclick=()=>document.getElementById('setup').classList.remove('on');
document.getElementById('btnRefresh').onclick=async()=>{
  if(!S.token){showSetup();return;}
  cache={};contentHits=null;shown=300;
  document.getElementById('list').innerHTML='<div class="loading"><div class="spin"></div>刷新中…</div>';
  try{files=await fetchFiles();buildExp();buildBooks();
    renderChips();renderList();setTitle();
    loadBooks().then(()=>{renderChips();if(mode==='book')renderList();setTitle();});
    toast('已刷新');
  }catch(e){toast('刷新失败：'+(e.message==='AUTH'?'钥匙失效':'网络问题'));renderList();}
};
const seq=[15,16,17,18,19,20,22];
function cycleFont(){
  let k=seq.indexOf(S.fs);if(k<0)k=1;S.fs=seq[(k+1)%seq.length];save();applyFont();
  toast('字号 '+S.fs+'px');
}
document.getElementById('btnFont').onclick=cycleFont;
document.getElementById('btnFont2').onclick=cycleFont;
document.getElementById('btnBack').onclick=closeRead;

let tmr=null;
document.getElementById('q').oninput=function(){
  shown=300;contentHits=null;
  const v=this.value.trim();
  document.getElementById('clr').classList.toggle('on',!!v);
  document.getElementById('hint').classList.remove('on');
  renderList();
  clearTimeout(tmr);
  if(v.length>=2){
    tmr=setTimeout(()=>{
      const cur=document.getElementById('q').value.trim();
      if(cur!==v)return;
      contentSearch(v);
    },600);
  }
};
document.getElementById('q').onkeydown=function(e){
  if(e.key==='Enter'){this.blur();clearTimeout(tmr);
    const v=this.value.trim();if(v.length>=2)contentSearch(v);}
};
document.getElementById('clr').onclick=()=>{
  const q=document.getElementById('q');q.value='';q.focus();
  contentHits=null;shown=300;document.getElementById('clr').classList.remove('on');
  renderList();
};

document.getElementById('btnSave').onclick=async()=>{
  const repo=normRepo(document.getElementById('inRepo').value);
  const tok=document.getElementById('inTok').value.trim();
  const m=document.getElementById('msg');
  if(!repo||!tok){m.className='err';m.textContent='两栏都要填。';return;}
  document.getElementById('inRepo').value=repo;
  S.repo=repo;S.token=tok;save();
  m.className='';m.textContent='正在试…';
  try{
    const r=await fetchT('https://api.github.com/repos/'+repo,{headers:{'Authorization':'token '+tok}},12000);
    if(r.status===401||r.status===404||r.status===403)throw new Error('AUTH');
    if(!r.ok)throw new Error('HTTP '+r.status);
    localStorage.setItem(KEY,JSON.stringify(S));
    m.textContent='连上了，正在加载…';
    document.getElementById('setup').classList.remove('on');
    boot();
  }catch(e){
    m.className='err';
    m.textContent='这个钥匙读不到仓库。检查两件事：①token 有没有勾 repo 权限 ②仓库名有没有写错（要带用户名）';
  }
};
document.getElementById('btnDiag').onclick=()=>{
  const repo=normRepo(document.getElementById('inRepo').value)||DEF.repo;
  const tok=document.getElementById('inTok').value.trim()||S.token;
  if(!tok){document.getElementById('msg').className='err';
    document.getElementById('msg').textContent='先填钥匙，才能诊断。';return;}
  diagnose(repo,tok);
};

/* 返回键关闭阅读层 */
window.addEventListener('popstate',()=>{if(document.getElementById('read').classList.contains('on'))closeRead();});

/* 刷新时浏览器会把上次输入恢复进搜索框（比如仓库名），再清一次 */
window.addEventListener('pageshow',function(){
  var e=document.getElementById('q');
  if(e.value&&e.value.indexOf('/')>=0)e.value='';
});
setTimeout(function(){
  var e=document.getElementById('q');
  if(e.value&&e.value.indexOf('/')>=0)e.value='';
},400);

boot();
</script>
</body>
